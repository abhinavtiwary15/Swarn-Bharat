[project]
name = "swarnbharat-monorepo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
constraint-dependencies = ["kombu<5.7"]

[tool.uv.workspace]
members = ["backend", "packages/shared"]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.26",
    "pytest-env>=1.1",
    "httpx>=0.27",
    "asgi-lifespan>=2.1",
    "pip-audit>=2.7",
    "pydantic[email]>=2.0",  # supplies email-validator for EmailStr in workspace dev tools
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "BLE", "RUF"]
ignore = ["B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "swarnbharat_shared"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**"   = ["S101", "S105", "S106", "S107", "E501"]
"backend/alembic/**" = ["E501", "UP007", "UP035"]
"scripts/**"         = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "pgvector.*", "pwdlib.*", "asyncpg.*", "backend.worker.tasks"]
ignore_missing_imports = true
disallow_untyped_decorators = false

[tool.pytest.ini_options]
asyncio_mode                      = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope   = "session"

env = [
    "APP_ENV=test",
    "D:DATABASE_URL=postgresql+asyncpg://swarnbharat:swarnbharat@localhost:5432/swarnbharat_test",
    "D:REDIS_BASE_URL=redis://localhost:6379",
    "D:JWT_SECRET_KEY=test-access-secret-key-that-is-32-bytes-x",
    "D:JWT_REFRESH_SECRET_KEY=test-refresh-secret-key-32bytes-xxxxx",
    "REDIS_DB_TOKENS=12",
    "REDIS_DB_RATE_LIMIT=13",
    "REDIS_DB_LOGIN_THROTTLE=14",
    "CORS_ORIGINS=http://localhost:3000",
]
