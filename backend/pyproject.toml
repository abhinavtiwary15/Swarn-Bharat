[project]
name = "swarnbharat-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "swarnbharat-shared",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "alembic>=1.13",
    "pydantic-settings>=2.7.0",
    "PyJWT>=2.9",
    "pwdlib[argon2]>=0.2",
    "httpx>=0.27",
    "redis>=5.0",
    "celery[redis]>=5.6.3",
]

[tool.uv.sources]
swarnbharat-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/backend"]
