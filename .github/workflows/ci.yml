name: CI

on:
  push:
    branches: [main, develop, "feature/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint • Type • Audit • Test • Schema
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: swarnbharat_test
          POSTGRES_USER: swarnbharat
          POSTGRES_PASSWORD: swarnbharat
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U swarnbharat"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://swarnbharat:swarnbharat@localhost:5432/swarnbharat_test
      REDIS_BASE_URL: redis://localhost:6379
      JWT_SECRET_KEY: ci-access-secret-key-32-bytes-xxxxxx
      JWT_REFRESH_SECRET_KEY: ci-refresh-secret-key-32-bytes-xxxxx
      ENFORCE_HTTPS: "false"

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b8115b80b4c7c5ddf6ffdd634974642d182 # v5.4.1
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --all-packages

      - name: Ruff lint
        run: uv run ruff check . --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy backend/src packages/shared/src backend/alembic scripts backend/tests

      - name: pip-audit (full transitive scan via lockfile export)
        run: |
          uv export --frozen --format requirements-txt --no-emit-workspace --all-packages > /tmp/reqs.txt
          uv run pip-audit -r /tmp/reqs.txt --skip-editable

      - name: Run Alembic migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Pytest
        run: uv run pytest backend/tests -v --tb=short

      - name: Ensure openapi.json is git-tracked
        run: |
          git ls-files --error-unmatch openapi.json || {
            echo "ERROR: openapi.json is not tracked by git. Add and commit it."
            exit 1
          }

      - name: Check openapi.json is up to date
        run: uv run python scripts/export_openapi.py --check
