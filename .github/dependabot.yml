version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 3
    ignore:
      # kombu<5.7 caps redis<6.5
      - dependency-name: "redis"
    groups:
      python-dependencies:
        patterns:
          - "*"
